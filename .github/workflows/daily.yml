name: Daily checkin

# 为什么用 GitHub Actions 而不是 CF Cron：
#   这个 Cloudflare 账户的 Workers Free 计划已经把 5 个 cron 配额用满了，
#   再加定时任务会被 API 拒绝（code 10072）。GitHub 定时器免费且不受此限制。
#   顺带解决另一个问题：workers.dev 在国内直连不通，而 GitHub runner 在墙外，能正常访问。

on:
  schedule:
    - cron: "5 16 * * *"   # UTC 16:05 = 北京 00:05
  workflow_dispatch:

concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 调用 Worker /run
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${WORKER_URL:-}" ] || [ -z "${STATUS_TOKEN:-}" ]; then
            echo "::error::缺少 WORKER_URL 或 STATUS_TOKEN secret"
            exit 1
          fi
          code=$(curl -sS --max-time 120 -o out.json -w "%{http_code}" \
                 "${WORKER_URL}/run?token=${STATUS_TOKEN}") || code=000
          echo "HTTP $code"
          cat out.json || true
          echo
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open("out.json"))
          except Exception as e:
              print("::error::响应不是 JSON:", e)
              sys.exit(1)
          print("余额:", d.get("balance"))
          steps = d.get("steps") or []
          for s in steps:
              print(" - %-16s %s" % (s.get("name"), s.get("status")))
          if not d.get("ok"):
              print("::error::worker 返回不成功")
              sys.exit(1)
          PY
          test "$code" = "200"
